<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disneyland Resort Ride Height Requirements</title>
<style>
  :root {
    --dl-navy: #1b2a4a;
    --dl-gold: #c9a24b;
    --dca-teal: #0f6b6b;
    --bg: #faf7f1;
    --paper: #fffdf8;
    --card: #ffffff;
    --text: #23272f;
    --muted: #6b7280;
    --rule: #e2ddd0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 20px 16px 60px; }
  .paper { max-width: 760px; margin: 0 auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 6px 24px rgba(27,42,74,0.10); overflow: hidden; }
  .nav { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: var(--dl-navy); }
  .nav a { color: #fff; text-decoration: none; font-size: 0.8rem; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.35); }
  .nav a.current { background: var(--dl-gold); border-color: var(--dl-gold); color: var(--dl-navy); }
  .masthead { text-align: center; padding: 26px 16px 8px; }
  .masthead h1 { margin: 0; font-size: 1.7rem; color: var(--dl-navy); }
  .masthead p { margin: 6px 0 0; color: var(--muted); font-size: 0.9rem; }
  .filter { margin: 14px 16px 0; padding: 12px 14px; background: #fff7e0; border: 1px solid var(--dl-gold); border-radius: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 0.9rem; }
  .filter select { font-size: 1rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--rule); }
  .filter .legend { width: 100%; color: var(--muted); font-size: 0.78rem; }
  #content { padding: 4px 16px 8px; }
  .section h2 { color: var(--dl-navy); font-size: 1.2rem; margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
  .section h2::after { content: ""; flex: 1; height: 1px; background: var(--dl-navy); opacity: 0.35; }
  .ride { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--rule); border-left: 5px solid var(--dl-navy); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .section.dca .ride { border-left-color: var(--dca-teal); }
  .rank { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--dl-navy); color: #fff; font-weight: 700; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; }
  .section.dca .rank { background: var(--dca-teal); }
  .info { flex: 1; min-width: 0; }
  .info h3 { margin: 0; font-size: 0.98rem; color: var(--dl-navy); line-height: 1.25; }
  .land { font-size: 0.74rem; color: var(--muted); margin-top: 2px; }
  .note { font-size: 0.78rem; margin-top: 4px; }
  .height { flex: none; text-align: center; font-weight: 700; font-size: 0.8rem; padding: 6px 10px; border-radius: 10px; background: #e3e8f4; color: var(--dl-navy); min-width: 74px; }
  .height small { display: block; font-weight: 500; font-size: 0.68rem; opacity: 0.8; }
  .height.any { background: #e4f3e6; color: #1e6b2e; }
  .ride.blocked { opacity: 0.4; }
  .ride.blocked .height { background: #f6dede; color: #9b2c2c; }
  .footer { padding: 14px 20px 22px; border-top: 3px double var(--dl-navy); text-align: center; font-size: 0.78rem; color: var(--muted); }
  .footer a { color: var(--dl-navy); font-weight: 700; text-decoration: none; }
  .status { padding: 30px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="paper">
  <div class="nav">
    <a href="/">🍔 Food Checklist</a>
    <a href="/rides.html" class="current">🎢 Ride Heights</a>
    <a href="/events.html">📰 Events Newsletter</a>
  </div>
  <div class="masthead">
    <h1>🎢 Ride Height Requirements</h1>
    <p>Every ride at Disneyland &amp; California Adventure, most popular first</p>
  </div>
  <div class="filter">
    <label for="kid"><strong>Rider height:</strong></label>
    <select id="kid"><option value="">Show all rides</option></select>
    <div class="legend">Pick a height to grey out the rides that rider can't go on yet.</div>
  </div>
  <div id="content"><div class="status">Loading rides…</div></div>
  <div class="footer">
    <div id="caveats"></div>
    <p><a href="/">Open the Food &amp; Drink Checklist →</a></p>
  </div>
</div>
<script>
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const cm = n => Math.round(n * 2.54);
  let data = null;

  function rideCard(r, kid) {
    const c = el('div', 'ride' + (kid && r.min && kid < r.min ? ' blocked' : ''));
    c.appendChild(el('div', 'rank', r.rank));
    const info = el('div', 'info');
    info.appendChild(el('h3', null, r.name));
    info.appendChild(el('div', 'land', r.land));
    if (r.note) info.appendChild(el('div', 'note', r.note));
    c.appendChild(info);
    const h = el('div', 'height' + (r.min ? '' : ' any'));
    if (r.min) {
      h.textContent = r.min + '"+';
      h.appendChild(el('small', null, cm(r.min) + ' cm'));
    } else {
      h.textContent = 'Any height';
    }
    c.appendChild(h);
    return c;
  }

  function render() {
    const kid = Number(document.getElementById('kid').value) || 0;
    const root = document.getElementById('content');
    root.textContent = '';
    data.parks.forEach(p => {
      const sec = el('div', 'section ' + p.id);
      sec.appendChild(el('h2', null, p.name + ' (' + p.rides.length + ' rides)'));
      p.rides.slice().sort((a, b) => a.rank - b.rank).forEach(r => sec.appendChild(rideCard(r, kid)));
      root.appendChild(sec);
    });
  }

  fetch('/rides.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      data = d;
      const sel = document.getElementById('kid');
      for (let i = 30; i <= 54; i += 2) {
        const o = el('option', null, i + '" (' + cm(i) + ' cm)');
        o.value = i;
        sel.appendChild(o);
      }
      sel.addEventListener('change', render);
      document.getElementById('caveats').textContent = d.caveats + ' Updated ' + d.updated + '.';
      render();
    })
    .catch(() => {
      document.getElementById('content').innerHTML = '<div class="status">Couldn\'t load the ride list. Please try again shortly.</div>';
    });
</script>
</body>
</html>
