<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Disneyland Dispatch — Weekly Events Newsletter</title>
<style>
  :root {
    --navy: #1b2a4a; --navy2: #2d4373; --gold: #c9a24b; --teal: #0f6b6b; --teal2: #1aa3a3;
    --red: #a63d40; --orange: #b5651d;
    --bg: #f4efe4; --paper: #fffdf8; --card: #ffffff; --text: #23272f; --muted: #6b7280; --rule: #e6dfcf;
    --soft: #f1ece0; --tipbg: #fff4e0; --tipborder: #e0b868; --tiptext: #7a5a12; --link: #0f6b6b;
    --pill-dl: #e3e8f4; --pill-dca: #dcf0ef; --pill-down: #f6e0e1; --pill-both: #f8eccb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1424; --paper: #151c30; --card: #1c2540; --text: #eef0f6; --muted: #98a1b8; --rule: #2b3556;
      --soft: #26304f; --tipbg: #2a2414; --tipborder: #6b5a2a; --tiptext: #e8cf94; --link: #4fd1d1;
      --pill-dl: #26335c; --pill-dca: #123c3e; --pill-down: #4a2327; --pill-both: #43380f;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; padding: 20px 16px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    background-image: radial-gradient(circle at 10% 0%, rgba(201,162,75,.18), transparent 40%), radial-gradient(circle at 95% 8%, rgba(26,163,163,.16), transparent 38%);
    background-attachment: fixed;
  }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .paper { max-width: 780px; margin: 0 auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 20px; box-shadow: 0 14px 44px rgba(27,42,74,.18); overflow: clip; }
  .nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; background: linear-gradient(90deg, var(--navy), var(--navy2)); }
  .nav a { color: #fff; text-decoration: none; font-size: .8rem; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35); transition: transform .15s, background .15s; }
  .nav a:hover { transform: translateY(-2px); background: rgba(255,255,255,.15); }
  .nav a.current, .nav a.current:hover { background: var(--gold); border-color: var(--gold); color: var(--navy); }

  /* masthead */
  .hero { position: relative; text-align: center; padding: 34px 18px 22px; color: #fff; overflow: hidden;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 55%, #4a2a6b 130%); }
  .hero::before, .hero::after { content: "✦"; position: absolute; color: var(--gold); opacity: .55; font-size: 2.2rem; animation: twinkle 3.2s ease-in-out infinite; }
  .hero::before { left: 8%; top: 18%; } .hero::after { right: 9%; bottom: 16%; animation-delay: 1.4s; font-size: 1.6rem; }
  @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.8) rotate(0); } 50% { opacity: .8; transform: scale(1.15) rotate(20deg); } }
  .kicker { font-size: .7rem; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .hero h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 8vw, 3.1rem); line-height: 1.05; margin: 8px 0 0; letter-spacing: -.01em; text-shadow: 0 2px 12px rgba(0,0,0,.35); }
  .stats { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .stat { background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.28); border-radius: 14px; padding: 8px 16px; backdrop-filter: blur(4px); }
  .stat b { display: block; font-size: 1.15rem; color: var(--gold); line-height: 1.2; }
  .stat span { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }

  .headline-wrap { padding: 24px 20px 4px; text-align: center; }
  .headline-wrap h2 { font-family: Georgia, serif; font-size: clamp(1.4rem, 5vw, 2rem); margin: 0 0 6px; line-height: 1.2; }
  .headline-wrap p { margin: 0; color: var(--muted); font-style: italic; font-family: Georgia, serif; }

  /* lead story */
  .lead { margin: 18px 16px 8px; border-radius: 16px; color: #fff; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #1b2a4a 0%, #4a2a6b 55%, #b5651d 100%); box-shadow: 0 8px 22px rgba(27,42,74,.25); }
  .lead::after { content: "✦ ✧ ✦"; position: absolute; top: 12px; right: 18px; letter-spacing: .4em; color: rgba(255,255,255,.45); font-size: .8rem; }
  .lead-inner { padding: 24px 22px 22px; }
  .lead .label { display: inline-block; font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 800; color: var(--navy); background: var(--gold); padding: 4px 10px; border-radius: 4px; }
  .lead h3 { font-family: Georgia, serif; font-size: clamp(1.4rem, 5.5vw, 1.9rem); margin: 12px 0 6px; line-height: 1.15; }
  .lead .lead-when { font-size: .85rem; opacity: .92; font-weight: 600; margin-bottom: 10px; }
  .lead p { margin: 0 0 14px; line-height: 1.55; font-size: .95rem; }
  .lead a.cta { display: inline-block; background: #fff; color: var(--navy); text-decoration: none; font-weight: 700; font-size: .85rem; padding: 9px 18px; border-radius: 999px; transition: transform .15s; }
  .lead a.cta:hover { transform: translateY(-2px); }

  /* sticky filter bar */
  .controls { position: sticky; top: 0; z-index: 5; margin-top: 14px; padding: 10px 16px; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; cursor: pointer; font: inherit; font-weight: 700; font-size: .78rem; padding: 7px 13px; border-radius: 999px; border: 2px solid var(--rule); background: var(--card); color: var(--text); transition: all .2s; }
  .chip[aria-pressed="true"] { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--navy), var(--navy2)); box-shadow: 0 3px 10px rgba(0,0,0,.2); }
  .chip[data-area="dca"][aria-pressed="true"] { background: linear-gradient(135deg, var(--teal), var(--teal2)); }
  .chip[data-area="downtown"][aria-pressed="true"] { background: linear-gradient(135deg, var(--red), #c9585b); }
  .chip[data-area="both"][aria-pressed="true"] { background: linear-gradient(135deg, #8a6a1c, var(--gold)); }
  .jump { display: flex; gap: 14px; flex-wrap: wrap; font-size: .75rem; }
  .jump a { color: var(--link); font-weight: 700; text-decoration: none; }
  .jump a:hover { text-decoration: underline; }

  /* sections + cards */
  .section { padding: 10px 16px 4px; scroll-margin-top: 90px; }
  .section h2, .hours h2 { font-family: Georgia, serif; font-size: 1.25rem; margin: 18px 0 12px; display: flex; align-items: center; gap: 10px; }
  .section h2::after, .hours h2::after { content: ""; flex: 1; height: 1px; background: var(--muted); opacity: .35; }
  .section h2 .count { order: 2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: .7rem; font-weight: 700; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--card); border: 1px solid var(--rule); border-left: 5px solid var(--navy); border-radius: 14px; padding: 14px 14px 12px;
    display: flex; flex-direction: column; gap: 7px; transition: transform .2s, box-shadow .2s; animation: rise .45s both; animation-delay: calc(var(--i, 0) * 45ms); }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(27,42,74,.16); }
  .card.dca { border-left-color: var(--teal); } .card.downtown { border-left-color: var(--red); } .card.both { border-left-color: var(--gold); }
  .card.urgent { box-shadow: 0 0 0 1px var(--orange) inset; }
  .card h3 { margin: 0; font-size: 1rem; line-height: 1.25; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .72rem; }
  .pill { font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: #6a5a2c; }
  .pill.area-dl { background: var(--pill-dl); color: var(--navy); } .pill.area-dca { background: var(--pill-dca); color: var(--teal); }
  .pill.area-downtown { background: var(--pill-down); color: var(--red); } .pill.area-both { background: var(--pill-both); color: #7a5a12; }
  .pill.hot { background: var(--orange); color: #fff; }
  .when { color: var(--muted); font-weight: 600; font-size: .78rem; }
  .card p { margin: 0; font-size: .86rem; line-height: 1.5; flex: 1; opacity: .92; }
  .card a.more { font-size: .78rem; font-weight: 700; color: var(--link); text-decoration: none; }
  .card a.more:hover { text-decoration: underline; }
  .empty { padding: 24px 16px; text-align: center; color: var(--muted); font-size: .9rem; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .tip { margin: 20px 16px 6px; padding: 14px 16px; background: var(--tipbg); border: 1px dashed var(--tipborder); border-radius: 12px; font-size: .88rem; line-height: 1.5; color: var(--tiptext); }
  .tip strong { text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; display: block; margin-bottom: 4px; }
  .footer { margin-top: 18px; padding: 16px 20px 22px; border-top: 3px double var(--muted); text-align: center; font-size: .75rem; color: var(--muted); line-height: 1.5; }
  .footer a { color: var(--link); font-weight: 700; text-decoration: none; }
  .status { text-align: center; padding: 40px 16px; color: var(--muted); }

  /* park hours */
  .hours { padding: 6px 16px 0; }
  .hours h2 a { order: 2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: .72rem; font-weight: 700; color: var(--link); text-decoration: none; white-space: nowrap; }
  .hours-box { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 4px 8px; overflow-x: auto; }
  .hours-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  .hours-table th { text-align: left; font-size: .7rem; font-weight: 700; color: var(--muted); padding: 6px 6px 4px; }
  .hours-table th.dl { color: var(--link); filter: none; } .hours-table th.dca { color: var(--link); }
  .hours-table td { padding: 6px 4px; border-top: 1px solid var(--rule); vertical-align: top; white-space: nowrap; }
  .hours-table tr.today td { background: var(--soft); font-weight: 700; }
  .hours-table .day { color: var(--muted); }
  .hours-table .ev { display: block; white-space: normal; font-size: .7rem; font-weight: 600; color: var(--orange); }
  .hours-table .ev .t { white-space: nowrap; }
  .hours-status { color: var(--muted); font-size: .82rem; padding: 8px 0; }

  @media (prefers-color-scheme: dark) {
    .pill.area-dl { color: #b9c8ff; } .pill.area-dca { color: #7fe0e0; }
    .pill.area-downtown { color: #ffb3b6; } .pill.area-both { color: #f2d98a; }
    .pill:not([class*="area-"]):not(.hot) { color: #d8d2bd; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  @media print { body { background: #fff; padding: 0; } .nav, .controls, .hours { display: none; } .paper { box-shadow: none; border: 0; } .card { break-inside: avoid; animation: none; } }
</style>
</head>
<body>

<div class="paper">
  <div class="nav">
    <a href="/">🍔 Food Checklist</a>
    <a href="/rides.html">🎢 Ride Heights</a>
    <a href="/events.html" class="current" aria-current="page">📰 Events Newsletter</a>
  </div>

  <header class="hero">
    <div class="kicker">The Weekly Guide to the Happiest Place</div>
    <h1>The Disneyland Dispatch</h1>
    <div class="stats">
      <div class="stat"><b id="issue">—</b><span>Issue</span></div>
      <div class="stat"><b id="week">—</b><span>Week of</span></div>
      <div class="stat"><b id="count">—</b><span>Events</span></div>
    </div>
  </header>

  <div class="hours">
    <h2>🕗 Park Hours This Week <a href="https://disneyland.disney.go.com/calendars/" target="_blank" rel="noopener">Official calendar ↗</a></h2>
    <div class="hours-box" id="hours-body"><div class="hours-status">Loading hours…</div></div>
  </div>

  <div id="content"><div class="status">Loading this week's issue…</div></div>

  <footer class="footer">
    <div id="caveats"></div>
    <p>Hungry, too? <a href="/">Open the Food &amp; Drink Checklist →</a></p>
  </footer>
</div>

<script>
  const AREA = { dl: 'Disneyland Park', dca: 'California Adventure', downtown: 'Downtown Disney', both: 'Both Parks' };
  const CHIPS = [['all', 'All'], ['dl', '🏰 Disneyland'], ['dca', '🎡 DCA'], ['downtown', '🛍️ Downtown'], ['both', '✨ Both parks']];
  const HOT = ['Ends soon', 'Ticketed'];
  let issue = null;
  let filter = 'all';

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function safeUrl(u) { return /^https:\/\//.test(u || '') ? u : null; }
  function matches(ev) { return filter === 'all' || ev.area === filter || ev.area === 'both'; }

  function card(ev, i) {
    const c = el('article', 'card ' + (ev.area || '') + (ev.badge === 'Ends soon' ? ' urgent' : ''));
    c.style.setProperty('--i', i);
    c.appendChild(el('h3', null, ev.title));
    const meta = el('div', 'meta');
    meta.appendChild(el('span', 'pill area-' + ev.area, AREA[ev.area] || ''));
    if (ev.badge) meta.appendChild(el('span', 'pill' + (HOT.includes(ev.badge) ? ' hot' : ''), ev.badge));
    c.appendChild(meta);
    c.appendChild(el('div', 'when', '📅 ' + ev.dates));
    c.appendChild(el('p', null, ev.body));
    const u = safeUrl(ev.url);
    if (u) {
      const a = el('a', 'more', 'Read more →');
      a.href = u; a.target = '_blank'; a.rel = 'noopener';
      c.appendChild(a);
    }
    return c;
  }

  function renderSections() {
    const root = document.getElementById('sections');
    root.textContent = '';
    let shown = 0;
    issue.sections.forEach((s, si) => {
      const evs = s.events.filter(matches);
      if (!evs.length) return;
      shown += evs.length;
      const sec = el('section', 'section');
      sec.id = 'sec-' + si;
      const h = el('h2', null, s.emoji + ' ' + s.title);
      h.appendChild(el('span', 'count', evs.length + (evs.length === 1 ? ' event' : ' events')));
      sec.appendChild(h);
      const g = el('div', 'grid');
      evs.forEach((ev, i) => g.appendChild(card(ev, i)));
      sec.appendChild(g);
      root.appendChild(sec);
    });
    if (!shown) root.appendChild(el('div', 'empty', 'Nothing listed for this area this week.'));
  }

  function render(d) {
    issue = d;
    const total = d.sections.reduce((n, s) => n + s.events.length, 0) + 1;
    document.getElementById('issue').textContent = '№ ' + d.issue;
    document.getElementById('week').textContent = d.weekOf;
    document.getElementById('count').textContent = total;
    const root = document.getElementById('content');
    root.textContent = '';

    const hw = el('div', 'headline-wrap');
    hw.appendChild(el('h2', null, d.headline));
    hw.appendChild(el('p', null, d.tagline));
    root.appendChild(hw);

    const L = d.lead;
    const lead = el('div', 'lead');
    const inner = el('div', 'lead-inner');
    inner.appendChild(el('span', 'label', 'Top Story' + (L.badge ? ' · ' + L.badge : '')));
    inner.appendChild(el('h3', null, L.title));
    inner.appendChild(el('div', 'lead-when', '📅 ' + L.dates + ' · ' + (AREA[L.area] || '')));
    inner.appendChild(el('p', null, L.body));
    const lu = safeUrl(L.url);
    if (lu) {
      const a = el('a', 'cta', 'Get the details →');
      a.href = lu; a.target = '_blank'; a.rel = 'noopener';
      inner.appendChild(a);
    }
    lead.appendChild(inner);
    root.appendChild(lead);

    const controls = el('div', 'controls');
    const chips = el('div', 'chips');
    chips.setAttribute('role', 'group');
    chips.setAttribute('aria-label', 'Filter events by park');
    CHIPS.forEach(([key, label]) => {
      const b = el('button', 'chip', label);
      b.type = 'button';
      b.dataset.area = key;
      b.setAttribute('aria-pressed', String(key === filter));
      b.addEventListener('click', () => {
        filter = key;
        chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.area === filter)));
        renderSections();
      });
      chips.appendChild(b);
    });
    controls.appendChild(chips);
    const jump = el('nav', 'jump');
    jump.setAttribute('aria-label', 'Jump to section');
    d.sections.forEach((s, si) => {
      const a = el('a', null, s.emoji + ' ' + s.title);
      a.href = '#sec-' + si;
      jump.appendChild(a);
    });
    controls.appendChild(jump);
    root.appendChild(controls);

    root.appendChild(el('div', null)).id = 'sections';
    renderSections();

    if (d.tip) {
      const t = el('div', 'tip');
      t.appendChild(el('strong', null, 'Insider tip'));
      t.appendChild(document.createTextNode(d.tip));
      root.appendChild(t);
    }
    document.getElementById('caveats').textContent = d.caveats || '';
  }

  fetch('/events.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(() => {
      document.getElementById('content').innerHTML =
        '<div class="status">Couldn\'t load this week\'s issue. Please try again shortly.</div>';
    });
</script>

<script>
  // ---- PARK HOURS ----
  // Pulls the next 7 days of hours from the free ThemeParks.wiki API and caches
  // them for a few hours so every page load doesn't hit the API.
  (function() {
    const PARKS = [
      { key: 'dl',  id: '7340550b-c14d-4def-80bb-acdb51d49a66' },
      { key: 'dca', id: '832fcd51-ea19-4e77-85c7-75d5843b127c' },
    ];
    const TZ = 'America/Los_Angeles';
    const CACHE_KEY = 'parkHoursCache_v1';
    const CACHE_MS = 6 * 60 * 60 * 1000;
    const DAYS = 7;
    const body = document.getElementById('hours-body');

    // YYYY-MM-DD for a Date, as seen in Anaheim.
    const ymd = (d) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(d);

    // "8a", "11p", "8:30a"
    function shortTime(iso) {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true,
      }).formatToParts(new Date(iso));
      const get = (t) => (parts.find(p => p.type === t) || {}).value;
      const min = get('minute');
      return get('hour') + (min === '00' ? '' : ':' + min) + get('dayPeriod').charAt(0).toLowerCase();
    }

    function readCache() {
      try {
        const c = JSON.parse(localStorage.getItem(CACHE_KEY));
        if (c && Date.now() - c.at < CACHE_MS && c.today === ymd(new Date())) return c.data;
      } catch (err) { /* storage unavailable */ }
      return null;
    }

    function writeCache(data) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), today: ymd(new Date()), data }));
      } catch (err) { /* storage unavailable */ }
    }

    async function fetchHours() {
      const out = {};
      await Promise.all(PARKS.map(async (p) => {
        const res = await fetch('https://api.themeparks.wiki/v1/entity/' + p.id + '/schedule');
        if (!res.ok) throw new Error('Hours request failed: ' + res.status);
        out[p.key] = (await res.json()).schedule || [];
      }));
      return out;
    }

    function cellFor(schedule, date) {
      const entries = schedule.filter(s => s.date === date);
      const op = entries.find(s => s.type === 'OPERATING');
      const events = entries.filter(s => s.type === 'TICKETED_EVENT');
      if (!op && !events.length) return '<span class="day">—</span>';
      let html = op ? shortTime(op.openingTime) + '–' + shortTime(op.closingTime) : 'Closed';
      events.forEach(ev => {
        html += '<span class="ev">🎟️ Ticketed event <span class="t">' +
          shortTime(ev.openingTime) + '–' + shortTime(ev.closingTime) + '</span></span>';
      });
      return html;
    }

    function render(data) {
      // Anchor on noon UTC of today's Anaheim date so stepping by 24h never
      // skips or repeats a day across a daylight-saving change.
      const base = new Date(ymd(new Date()) + 'T12:00:00Z');
      let rows = '';
      for (let i = 0; i < DAYS; i++) {
        const d = new Date(base.getTime() + i * 86400000);
        const date = ymd(d);
        const label = i === 0 ? 'Today' : new Intl.DateTimeFormat('en-US', {
          timeZone: TZ, weekday: 'short', month: 'numeric', day: 'numeric',
        }).format(d);
        rows += '<tr' + (i === 0 ? ' class="today"' : '') + '>' +
          '<td class="day">' + label + '</td>' +
          '<td>' + cellFor(data.dl, date) + '</td>' +
          '<td>' + cellFor(data.dca, date) + '</td></tr>';
      }
      body.innerHTML =
        '<table class="hours-table"><thead><tr><th></th>' +
        '<th class="dl">🏰 Disneyland</th><th class="dca">🎡 California Adv.</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
    }

    const cached = readCache();
    if (cached) {
      render(cached);
    } else {
      fetchHours()
        .then(data => { writeCache(data); render(data); })
        .catch(err => {
          console.error('Park hours failed', err);
          body.innerHTML = '<div class="hours-status">Hours unavailable right now — check the official calendar.</div>';
        });
    }
  })();
</script>
</body>
</html>
